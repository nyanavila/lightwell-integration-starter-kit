---
# Lightwell Fast Path: Automated Vulnerability Ingestion & Orchestration Playbook
- name: Orchestrate Overnight Lightwell Patch Delivery
  hosts: localhost
  gather_facts: false
  vars:
    lightwell_api_url: "https://console.example.com/api/lightwell/v1"
    target_applications:
      - name: "wire-transfer-service"
        risk_class: "PCI-REGULATED"
        auto_merge_allowed: false
      - name: "benefits-mgmt-app"
        risk_class: "INTERNAL-NON-CRITICAL"
        auto_merge_allowed: true

  tasks:
    - name: Receive Lightwell Publication Webhook Event
      ansible.builtin.debug:
        msg: "Event received: Lightwell published 14 CVE fixes across 298 package builds."

    - name: Classify Application Risk and Trigger OpenShift AI Deep Agent
      ansible.builtin.debug:
        msg: "App: {{ item.name }} | Risk: {{ item.risk_class }} | Auto-Merge: {{ item.auto_merge_allowed }}"
      loop: "{{ target_applications }}"

    - name: Process High-Risk PCI Regulated Applications (Human Approval Route)
      ansible.builtin.debug:
        msg: "Created Merge Request for {{ item.name }}. Routing for human-in-the-loop sign-off."
      when: not item.auto_merge_allowed
      loop: "{{ target_applications }}"

    - name: Process Low-Risk Internal Applications (Fast Path Auto-Merge)
      ansible.builtin.debug:
        msg: "Automated checks passed for {{ item.name }}. Auto-merged PR and promoted to Trusted Software Factory."
      when: item.auto_merge_allowed
      loop: "{{ target_applications }}"
