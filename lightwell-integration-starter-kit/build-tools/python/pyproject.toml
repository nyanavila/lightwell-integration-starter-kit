[tool.poetry]
name = "payment-service"
version = "1.0.0"
description = "Sample microservice consuming Red Hat Lightwell secured dependencies"
authors = ["Architecture Team <arch@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
# Pinned Lightwell remediated dependencies
flask = "2.2.5.rhlw-00001"
urllib3 = "1.26.18.rhlw-00001"
cryptography = "41.0.7.rhlw-00001"

[[tool.poetry.source]]
name = "lightwell-remediated"
url = "https://packages.example.com/api/pypi/lightwell/remediated/simple/"
priority = "primary"

[[tool.poetry.source]]
name = "lightwell-validated"
url = "https://packages.example.com/api/pypi/lightwell/validated/simple/"
priority = "supplemental"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
